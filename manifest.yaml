manifestVersion: 1
name: "@mesgme/serve-token-expiry"
version: "2026.09.30.1"
description: "Warn before swamp serve tokens expire — a reusable model type for any swamp repo"
license: "Apache-2.0"
valueStatement: >-
  Stops a swamp serve token from lapsing unnoticed. It checks the expiry dates
  of a repo's active serve tokens (metadata only, never secrets), classifies
  each as ok, warn or expired against a configurable warning window (default
  7 days), and writes a status that a workflow can turn into an alert, so
  clients are not taken down silently by an expired token.
repository: "https://github.com/mesgme/swamp-serve-token-expiry"
paths:
  base: manifest
models:
  - extensions/models/serve_token_expiry.ts
additionalFiles:
  - README.md
  - LICENSE
